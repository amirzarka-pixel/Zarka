name: Build Austria 2027 APK
on:
  push:
    paths: ['austria-android/**', '.github/workflows/austria-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        working-directory: austria-android
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp austria-android/app/build/outputs/apk/debug/app-debug.apk austria-2027.apk
      - uses: actions/upload-artifact@v4
        with: { name: austria-2027-apk, path: austria-2027.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete austria-apk -y --cleanup-tag || true
          gh release create austria-apk austria-2027.apk -t "אוסטריה 2027 - APK" -n "קובץ התקנה לאנדרואיד של אפליקציית הטיול"
